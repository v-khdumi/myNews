name: Deploy Azure Web App

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: azure-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate deployment target
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        run: |
          test -n "$RESOURCE_GROUP" || { echo "::error::Set AZURE_RESOURCE_GROUP in the azure-production environment."; exit 1; }
          test -n "$WEBAPP_NAME" || { echo "::error::Set AZURE_WEBAPP_NAME in the azure-production environment."; exit 1; }
      - name: Install and verify
        run: |
          pip install -r requirements.txt
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/*.test.mjs
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy and verify application startup
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        run: |
          python -m scripts.deploy_azure deploy \
            --resource-group "$RESOURCE_GROUP" --name "$WEBAPP_NAME"
