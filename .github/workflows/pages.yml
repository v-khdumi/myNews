name: RSS integration verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: copilot/fix-stiripesurse-feed
      - name: Run regression tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/*.test.mjs
      - name: Verify live fallback and edition contract
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import json
          from pathlib import Path
          from scripts.aggregate import SOURCES, collect_source, iso_date
          source = next(s for s in SOURCES if s.id == "stiripesurse")
          now = datetime.now(timezone.utc)
          articles, status = collect_source(source, now)
          assert articles, "No valid recent headlines collected"
          assert all(a["via"] == "google_news" and a["title"] for a in articles)
          assert status["status"] == "partial" and "Google News" in status["error"]
          print(f"VERIFIED: {len(articles)} valid recent Stiripesurse headlines via Google News")
          Path("rss-check.json").write_text(json.dumps({
              "generated_at": iso_date(now), "window_hours": 24,
              "sources": [status], "articles": articles,
          }, ensure_ascii=False), encoding="utf-8")
          PY
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          import {validateEdition, currentArticles, selectArticles} from './news-core.mjs';
          const edition = validateEdition(JSON.parse(readFileSync('rss-check.json', 'utf8')));
          const articles = selectArticles(edition.articles, {source: 'stiripesurse'});
          if (!articles.length) throw new Error('No recent articles accepted by the client');
          console.log(`VERIFIED: ${articles.length} headlines accepted by client validation and source filter`);
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: rss-check
          path: rss-check.json
          retention-days: 1
