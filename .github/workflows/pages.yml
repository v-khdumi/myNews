name: Actualizează și publică știrile

on:
  push:
    branches: [main]
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descarcă repository-ul
        uses: actions/checkout@v4
      - name: Configurează Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configurează Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verifică agregatorul și filtrele
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/*.test.mjs
      - name: Restaurează ediția precedentă
        uses: actions/cache/restore@v4
        with:
          path: .cache/news.json
          key: news-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            news-
      - name: Construiește pagina și preia știrile
        run: |
          mkdir -p _site/data .cache
          cp index.html styles.css app.mjs news-core.mjs favicon.svg _site/
          touch _site/.nojekyll
          python scripts/aggregate.py --previous .cache/news.json --output _site/data/news.json
          cp _site/data/news.json .cache/news.json
      - name: Păstrează ediția pentru următoarea actualizare
        uses: actions/cache/save@v4
        with:
          path: .cache/news.json
          key: news-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Pregătește publicarea
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publică pe GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
