name: RSS connectivity diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check public RSS endpoints without deploying
        run: |
          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          from scripts.aggregate import SOURCES, parse_feed
          source = next(s for s in SOURCES if s.id == "stiripesurse")
          endpoints = [
              "https://www.stiripesurse.ro/rss/stiri.xml",
              "https://stiripesurse.ro/rss/stiri.xml",
              "https://www.stiripesurse.ro/rss/stirile-zilei.xml",
          ]
          agents = ["myNews-RSS/1.0 (GitHub Pages headline aggregator)", "Python-urllib/3.12"]
          def check(pair):
              url, agent = pair
              request = Request(url, headers={"User-Agent": agent, "Accept": "application/rss+xml, application/xml, text/xml;q=0.9"})
              try:
                  with urlopen(request, timeout=20) as response:
                      body = response.read(8 * 1024 * 1024)
                      articles = parse_feed(body, source, response.url)[0]
                      return f"{url} | {agent} | HTTP {response.status} | articles={len(articles)}"
              except HTTPError as error:
                  return f"{url} | {agent} | HTTP {error.code} | headers={dict(error.headers)} | body={error.read(1500)!r}"
              except Exception as error:
                  return f"{url} | {agent} | {type(error).__name__}: {error}"
          with ThreadPoolExecutor(max_workers=6) as pool:
              for result in pool.map(check, [(url, agent) for url in endpoints for agent in agents]):
                  print(result)
          PY
