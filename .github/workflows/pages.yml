name: RSS connectivity diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check public RSS endpoints without deploying
        run: |
          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          import xml.etree.ElementTree as ET
          endpoints = [
              "https://news.google.com/rss/search?q=site%3Astiripesurse.ro+when%3A1d&hl=ro&gl=RO&ceid=RO%3Aro",
          ]
          agents = ["myNews-RSS/1.0 (GitHub Pages headline aggregator)"]
          def check(pair):
              url, agent = pair
              request = Request(url, headers={"User-Agent": agent, "Accept": "application/rss+xml, application/xml, text/xml;q=0.9"})
              try:
                  with urlopen(request, timeout=20) as response:
                      body = response.read(8 * 1024 * 1024)
                      root = ET.fromstring(body)
                      items = root.findall(".//item")
                      return f"{url} | HTTP {response.status} | items={len(items)} | first={ET.tostring(items[0], encoding='unicode')[:2500] if items else 'none'}"
              except HTTPError as error:
                  return f"{url} | {agent} | HTTP {error.code} | headers={dict(error.headers)} | body={error.read(1500)!r}"
              except Exception as error:
                  return f"{url} | {agent} | {type(error).__name__}: {error}"
          with ThreadPoolExecutor(max_workers=6) as pool:
              for result in pool.map(check, [(url, agent) for url in endpoints for agent in agents]):
                  print(result)
          PY
